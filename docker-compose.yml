# Bases de datos locales de SoccerBet. Uso: docker compose up -d
# SQL Server es opcional (perfil): si ya lo tienes instalado local, no lo levantes.
#   docker compose --profile sqlserver up -d
services:
  sqlserver:
    profiles: ["sqlserver"]
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports: ["1433:1433"]
    volumes: [sqlserver_data:/var/opt/mssql]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: soccerbet_catalogo
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/mysql:/docker-entrypoint-initdb.d:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: soccerbet_partidos
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/postgres:/docker-entrypoint-initdb.d:ro

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db
      - ./db/mongo:/docker-entrypoint-initdb.d:ro

volumes: { sqlserver_data: {}, mysql_data: {}, pg_data: {}, mongo_data: {} }